<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Gallery</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="index.html">Video Gallery</a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="upload.html">Upload Video</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="gallery.html">View Gallery</a>
                </li>
            </ul>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        Account
                    </a>
                    <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <div class="dropdown-item form-switch">
                            <input class="form-check-input" type="checkbox" id="darkModeToggle">
                            <label class="form-check-label" for="darkModeToggle">Dark Mode</label>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </nav>
    <div class="container my-4">
        <h1 class="mb-4">Video Gallery</h1>
        <div class="row" id="videoGallery">
            <!-- Video cards will be dynamically inserted here -->
        </div>
        <div class="mt-4">
            <h2>Upload a New Video</h2>
            <form id="uploadForm">
                <div class="form-group">
                    <label for="videoFile">Select Video File</label>
                    <input type="file" class="form-control" id="videoFile" name="videoFile" accept="video/*">
                </div>
                <div class="form-group">
                    <label for="thumbnailFile">Select Thumbnail</label>
                    <input type="file" class="form-control" id="thumbnailFile" name="thumbnailFile" accept="image/*">
                </div>
                <button type="submit" class="btn btn-primary">Upload</button>
            </form>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="js/scripts.js"></script>
</body>
</html>
